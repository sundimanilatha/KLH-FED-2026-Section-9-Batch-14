<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Parking — DDCA Project</title>
<style>
  :root{
    --bg: #fff5f9;
    --bg-2: #ffffff;
    --pink: #ec4899;
    --pink-bright: #db2777;
    --pink-soft: #fbcfe8;
    --text: #2a1a22;
    --muted: #a4788e;
    --card-bg: #ffffff;
    --card-border: #f6c9dd;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse at 15% -5%, rgba(236,72,153,0.10), transparent 55%),
      radial-gradient(ellipse at 85% 105%, rgba(236,72,153,0.08), transparent 50%),
      var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    height: 100vh;
    position: relative;
  }

  .line-layer{ position:absolute; top:0; left:0; width:100%; height:55%; pointer-events:none; opacity: 0.95; transition: opacity .3s ease; }
  .line-layer svg{width:100%; height:100%;}
  .path-track{ fill:none; stroke: rgba(236,72,153,0.18); stroke-width: 1.5; }
  .path-glow{
    fill:none; stroke: var(--pink); stroke-width: 2.2;
    stroke-dasharray: 6 700;
    filter: drop-shadow(0 0 7px rgba(236,72,153,0.65));
    animation: travel 7s linear infinite;
  }
  @keyframes travel{ 0%{stroke-dashoffset:0;} 100%{stroke-dashoffset:-706;} }
  .node{ fill: var(--pink-bright); filter: drop-shadow(0 0 8px rgba(219,39,119,0.7)); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ r:4; opacity:1; } 50%{ r:6; opacity:0.6; } }

  .deck{ position:relative; z-index:2; max-width: 1040px; margin: 0 auto; padding: 78px 32px 0; height: 100%; overflow-y: auto; }

  .eyebrow{ display:flex; align-items:center; gap:10px; font-size: 12px; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 6px; opacity:0; animation: fadeInUp .5s ease .02s forwards; }
  .eyebrow .rule{ width:24px; height:1px; background: var(--muted); display:inline-block; }
  .tagline{ font-size: 12px; letter-spacing: 0.08em; color: var(--pink-bright); margin-bottom: 18px; font-weight:600; opacity:0; animation: fadeInUp .5s ease .08s forwards; }

  .index{ position:absolute; top:78px; right:32px; font-size: 12px; color: var(--muted); letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }

  .badge{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; letter-spacing:0.08em; font-weight:600;
    color: #ffffff;
    background: linear-gradient(135deg, var(--pink), var(--pink-bright));
    padding: 7px 14px; border-radius: 999px; margin-bottom: 24px;
    box-shadow: 0 4px 14px rgba(219,39,119,0.28);
    opacity:0; animation: fadeInUp .5s ease .14s forwards;
  }

  h1{ font-size: 46px; line-height: 1.08; font-weight: 800; letter-spacing: -0.01em; opacity:0; animation: fadeInUp .55s ease .2s forwards; }
  h1 .accent{ color: var(--pink-bright); display:block; }

  .desc{ max-width: 660px; margin-top: 18px; color: var(--muted); font-size: 15px; line-height: 1.6; opacity:0; animation: fadeInUp .55s ease .28s forwards; }

  @keyframes fadeInUp{ from{ opacity:0; transform: translateY(12px); } to{ opacity:1; transform: translateY(0); } }

  .cards{ display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; margin-top: 34px; }
  .cards.cols-3{ grid-template-columns: repeat(3, minmax(0,1fr)); }
  .cards.cols-2{ grid-template-columns: repeat(2, minmax(0,1fr)); }
  .card{
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px 18px; min-height: 90px;
    box-shadow: 0 2px 10px rgba(236,72,153,0.06);
    opacity:0; transform: translateY(14px);
    animation: fadeInUp .5s ease forwards;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .card:hover{ transform: translateY(-3px); box-shadow: 0 10px 22px rgba(236,72,153,0.18); border-color: var(--pink); }
  .card .label{ font-size: 10px; letter-spacing: 0.1em; color: var(--pink-bright); margin-bottom: 8px; font-weight:700; }
  .card .value{ font-size: 13.5px; font-weight: 600; line-height: 1.45; color: var(--text); }
  .card .num{ font-size:11px; color:var(--muted); margin-bottom:6px; font-weight:700; }

  /* roster (roll no separated from name) */
  .roster{ display:flex; flex-direction:column; gap:6px; margin-top:2px; }
  .roster-row{ display:flex; align-items:baseline; gap:10px; }
  .roster-row .roll{
    font-family: 'Cascadia Code','Consolas',monospace; font-size: 11.5px;
    color: var(--pink-bright); background: var(--pink-soft);
    border-radius: 5px; padding: 2px 6px; flex-shrink:0; font-weight:700;
  }
  .roster-row .name{ font-size: 13px; color: var(--text); font-weight:600; }

  .card:nth-of-type(1){ animation-delay: .34s; }
  .card:nth-of-type(2){ animation-delay: .40s; }
  .card:nth-of-type(3){ animation-delay: .46s; }
  .card:nth-of-type(4){ animation-delay: .52s; }
  .card:nth-of-type(5){ animation-delay: .58s; }
  .card:nth-of-type(6){ animation-delay: .64s; }

  .items{ margin-top: 30px; display:flex; flex-direction:column; gap: 14px; }
  .item{ display:flex; gap: 16px; align-items:flex-start; opacity:0; animation: fadeInUp .5s ease forwards; }
  .item:nth-of-type(1){ animation-delay:.34s; } .item:nth-of-type(2){ animation-delay:.4s; }
  .item:nth-of-type(3){ animation-delay:.46s; } .item:nth-of-type(4){ animation-delay:.52s; }
  .item:nth-of-type(5){ animation-delay:.58s; }
  .item .n{ flex-shrink:0; width:30px; height:30px; border-radius:50%; border: 1px solid var(--pink); color: var(--pink-bright); font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; background: var(--pink-soft); }
  .item .t{ font-size: 14.5px; font-weight:700; margin-bottom:2px; }
  .item .d{ font-size: 13.5px; color: var(--muted); line-height:1.5; }

  table{ margin-top: 28px; border-collapse: collapse; width: 100%; max-width: 640px; opacity:0; animation: fadeInUp .6s ease .3s forwards; }
  th, td{ border: 1px solid var(--card-border); padding: 9px 14px; text-align:center; font-size: 13.5px; }
  th{ background: var(--pink-soft); color: var(--pink-bright); font-weight:700; letter-spacing:0.03em; }
  td{ color: var(--text); background: #fff; }

  .eqs{ margin-top: 30px; display:flex; flex-direction:column; gap:12px; max-width:600px; }
  .eq{ display:flex; align-items:center; gap:16px; background:var(--card-bg); border:1px solid var(--card-border); border-radius:8px; padding:12px 18px; opacity:0; animation: fadeInUp .5s ease forwards; transition: box-shadow .2s ease; }
  .eq:hover{ box-shadow: 0 6px 16px rgba(236,72,153,0.15); }
  .eq:nth-of-type(1){animation-delay:.34s;} .eq:nth-of-type(2){animation-delay:.4s;}
  .eq:nth-of-type(3){animation-delay:.46s;} .eq:nth-of-type(4){animation-delay:.52s;} .eq:nth-of-type(5){animation-delay:.58s;}
  .eq .name{ font-size:13px; color:var(--pink-bright); font-weight:800; min-width:80px; }
  .eq .formula{ font-size:14px; font-family: 'Cascadia Code', 'Consolas', monospace; color: var(--text); }

  .cols{ margin-top: 32px; display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; align-items:start; }
  .col-title{ font-size:11px; letter-spacing:0.1em; color:var(--muted); margin-bottom:10px; font-weight:700; }
  .col .card{ margin-bottom: 10px; }

  .compare{ margin-top: 30px; display:grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .compare-col .head{ font-size:12px; letter-spacing:0.08em; margin-bottom:14px; font-weight:800;}
  .compare-col.good .head{ color: #16a34a; }
  .compare-col.bad .head{ color: var(--pink-bright); }
  .compare-row{ display:flex; gap:10px; font-size:13.5px; color:var(--text); margin-bottom:11px; line-height:1.4; opacity:0; animation: fadeInUp .5s ease forwards; }
  .compare-row:nth-of-type(1){animation-delay:.34s;} .compare-row:nth-of-type(2){animation-delay:.42s;}
  .compare-row:nth-of-type(3){animation-delay:.5s;} .compare-row:nth-of-type(4){animation-delay:.58s;}
  .compare-col.good .mark{ color: #16a34a; }
  .compare-col.bad .mark{ color: var(--pink-bright); }

  .refs{ margin-top:22px; display:flex; flex-direction:column; gap:8px; }
  .refs .r{ font-size:13px; color:var(--muted); opacity:0; animation: fadeInUp .5s ease forwards; }
  .refs .r:nth-of-type(1){animation-delay:.34s;} .refs .r:nth-of-type(2){animation-delay:.4s;}
  .refs .r:nth-of-type(3){animation-delay:.46s;} .refs .r:nth-of-type(4){animation-delay:.52s;}
  .refs .r::before{ content:"— "; color: var(--pink-bright); }

  .progress{ position:absolute; bottom: 30px; left: 32px; display:flex; align-items:center; gap: 6px; z-index: 3; }
  .dot{ width: 16px; height: 3px; border-radius: 2px; background: var(--pink-soft); transition: all .35s ease; cursor:pointer; }
  .dot.active{ background: var(--pink-bright); width: 26px; }

  .arrows{ position:absolute; bottom: 24px; right: 32px; display:flex; gap: 10px; z-index:3; }
  .arrow{
    width:38px; height:38px; border-radius: 50%; border:1px solid var(--card-border);
    background: #fff; color: var(--pink-bright);
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition: all .2s ease;
    box-shadow: 0 2px 8px rgba(236,72,153,0.1);
  }
  .arrow:hover{ background: var(--pink); border-color: var(--pink); color:#fff; transform: scale(1.06); }
  .arrow svg{ width:15px; height:15px; }

  .slide{ opacity:0; transform: translateY(14px); transition: opacity .5s ease, transform .5s ease; position:absolute; top:0; left:0; width:100%; pointer-events:none; padding-bottom: 90px; }
  .slide.active{ opacity:1; transform: translateY(0); position:relative; pointer-events:auto; }

  .thanks-wrap{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; min-height: 66vh; }
  .thanks-eyebrow{ font-size:12px; letter-spacing:0.14em; color: var(--pink-bright); font-weight:700; margin-bottom:18px; opacity:0; animation: fadeInUp .5s ease .05s forwards; }
  .thanks-wrap h1{ font-size: 68px; opacity:0; animation: fadeInUp .6s ease .12s forwards; }
  .thanks-wrap .sub{ margin-top:16px; max-width:520px; color: var(--muted); font-size:15px; line-height:1.6; opacity:0; animation: fadeInUp .55s ease .22s forwards; }
  .thanks-names{ margin-top:36px; display:flex; gap:14px; flex-wrap:wrap; justify-content:center; opacity:0; animation: fadeInUp .55s ease .3s forwards; }
  .thanks-names .roster-row{ background: var(--card-bg); border:1px solid var(--card-border); border-radius:999px; padding:8px 16px; box-shadow: 0 2px 10px rgba(236,72,153,0.06); }

  @media (max-width: 760px){
    h1{font-size:32px;}
    .cards, .cards.cols-3, .cards.cols-2{grid-template-columns: repeat(2, minmax(0,1fr));}
    .cols{grid-template-columns: 1fr;}
    .compare{grid-template-columns: 1fr;}
    .deck{padding-top: 60px;}
  }
</style>
</head>

  }
  return `
    <div class="index">${String(i+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}</div>
    <div class="eyebrow"><span class="rule"></span>${s.eyebrow}</div>
    <div class="tagline">${s.tag}</div>
    <div class="badge">${s.badge}</div>
    <h1>${s.heading[0]}<span class="accent">${s.heading[1]}</span></h1>
    ${s.desc ? `<p class="desc">${s.desc}</p>` : ''}
  `;
}

function cardInner(c){
  if(c.roster){
    return `<div class="label">${c.label}</div><div class="roster">${c.roster.map(m => `<div class="roster-row"><span class="roll">${m.roll}</span><span class="name">${m.name}</span></div>`).join('')}</div>`;
  }
  return `<div class="label">${c.label}</div><div class="value">${c.value}</div>`;
}

function bodyHTML(s){
  if(s.type === 'title'){
    return `<div class="cards">
      ${s.cards.map(c => `<div class="card">${cardInner(c)}</div>`).join('')}
    </div>`;
  }
  if(s.type === 'list'){
    const colClass = s.cols === 3 ? ' cols-3' : '';
    return `<div class="cards${colClass}">
      ${s.items.map((it,idx) => `
        <div class="card">
          <div class="num">0${idx+1}</div>
          <div class="value" style="margin-bottom:6px;">${it.t}</div>
          <div style="font-size:12.5px; color:var(--muted); line-height:1.5; font-weight:400;">${it.d}</div>
        </div>
      `).join('')}
    </div>`;
  }
  if(s.type === 'columns'){
    return `<div class="cols">
      ${s.columns.map(col => `
        <div class="col">
          <div class="col-title">${col.title}</div>
          ${col.cards.map(c => `<div class="card"><div class="value" style="font-weight:500;">${c}</div></div>`).join('')}
        </div>
      `).join('')}
    </div>`;
  }
  if(s.type === 'table'){
    return `<table>
      <tr>${s.headers.map(h => `<th>${h}</th>`).join('')}</tr>
      ${s.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}
    </table>`;
  }
  if(s.type === 'equations'){
    return `<div class="eqs">
      ${s.equations.map(e => `<div class="eq"><div class="name">${e.name} =</div><div class="formula">${e.formula}</div></div>`).join('')}
    </div>`;
  }
  if(s.type === 'compare'){
    return `<div class="compare">
      <div class="compare-col good">
        <div class="head">Advantages</div>
        ${s.pros.map(p => `<div class="compare-row"><span class="mark">+</span><span>${p}</span></div>`).join('')}
      </div>
      <div class="compare-col bad">
        <div class="head">Limitations</div>
        ${s.cons.map(c => `<div class="compare-row"><span class="mark">\u2013</span><span>${c}</span></div>`).join('')}
      </div>
    </div>`;
  }
  if(s.type === 'content'){
    return s.refs ? `<div class="refs">${s.refs.map(r => `<div class="r">${r}</div>`).join('')}</div>` : '';
  }
  return '';
}

function updateLine(){
  const p = linePaths[current % linePaths.length];
  const lineLayer = document.getElementById('lineLayer');
  lineLayer.style.opacity = '0';
  setTimeout(() => {
    document.getElementById('pathTrack').setAttribute('d', p.d);
    document.getElementById('pathGlow').setAttribute('d', p.d);
    document.getElementById('lineNode').setAttribute('cx', p.start.x);
    document.getElementById('lineNode').setAttribute('cy', p.start.y);
    lineLayer.style.opacity = '0.95';
  }, 220);
}

function render(){
  deck.innerHTML = '';
  progress.innerHTML = '';

  slides.forEach((s, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide' + (i === current ? ' active' : '');
    slide.innerHTML = headerHTML(s, i) + bodyHTML(s);
    deck.appendChild(slide);

    const dot = document.createElement('div');
    dot.className = 'dot' + (i === current ? ' active' : '');
    dot.addEventListener('click', () => { current = i; render(); });
    progress.appendChild(dot);
  });

  updateLine();
}

document.getElementById('next').addEventListener('click', () => { current = (current + 1) % slides.length; render(); });
document.getElementById('prev').addEventListener('click', () => { current = (current - 1 + slides.length) % slides.length; render(); });
document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') document.getElementById('next').click();
  if(e.key === 'ArrowLeft') document.getElementById('prev').click();
});

render();
</script>
</body>
</html>
